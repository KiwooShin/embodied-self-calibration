name: Research review
on:
  schedule:
    - cron: '17 17 * * *'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: daily-research-review
  cancel-in-progress: false

jobs:
  reproduce:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Install physics and document tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pyode python3-pytest python3-matplotlib python3-pil fonts-dejavu-core poppler-utils ffmpeg
      - name: Run the experiment and paper regression checks
        env:
          PYTHONPATH: experiments:experiments/drawer:paper
        run: /usr/bin/python3 -m pytest -q experiments/drawer/tests experiments/tests paper/tests
      - name: Check artifacts and run the next observation-error replication
        run: |
          /usr/bin/python3 experiments/review.py --advance >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the verified replication and progress checkpoint
        run: |
          git add progress.md results/replications/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Record daily paired replication and update research progress'
            git push origin HEAD:main
          fi
